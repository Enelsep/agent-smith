[project]
name = "agent-smith"
version = "0.1.0"
description = "Agent Smith project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "mypy",
    "ruff",
    "pytest",
	"mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    ]
[project.scripts]
sandbox = "agent_smith.cli.sandbox.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/agent_smith", "src/agent_mbpp", "src/agent_swebench"]
[tool.hatch.build.targets.wheel.force-include]
"mcp_tools_mbpp.py" = "mcp_tools_mbpp.py"
"mcp_tools_swebench.py" = "mcp_tools_swebench.py"
[tool.pytest.ini_options]
# Without this, pytest run from the repo root also collects the tests of the
# moulinette checkout that sits next to us locally, and dies on `import docker`.
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# contract.py mirrors the Pydantic contract the evaluation imposes on us. Its
# timestamps are naive `datetime.now()` calls, exactly as in the reference file:
# making them timezone-aware would change the serialized ISO string of a frozen
# contract just to satisfy a lint rule.
"src/agent_smith/models/contract.py" = ["DTZ005"]

[tool.mypy]
# Without `mypy_path`, mypy resolves `agent_smith.*` through the installed
# distribution instead of the sources here. Combined with the absence of a
# `py.typed` marker, that made every one of our own cross-module imports `Any`
# — `ignore_missing_imports` silenced the warning, so `make check` passed while
# checking almost nothing across module boundaries. The marker files and this
# line are what make the type gate real; do not drop either.
mypy_path = "src"
warn_return_any = true
explicit_package_bases = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
# Checked from the repository root, not just `src/`: `mcp_tools_*.py`, `main.py`
# and the test suite live outside it, and the first two are artefacts the
# evaluation imports. The exclusions are declared here rather than passed on the
# command line so they hold even where `moulinette/` is absent — it is gitignored
# and exists on no machine but ours.
exclude = [
    '\.venv/',
    'moulinette/',
]
