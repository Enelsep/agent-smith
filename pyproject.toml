[project]
name = "agent-smith"
version = "0.1.0"
description = "Agent Smith project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "mypy",
    "flake8",
    "ruff",
    "pytest",
    ]
[project.scripts]
sandbox = "agent_smith.cli.sandbox.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["agent_smith", "src/agent_mbpp", "src/agent_swebench"]
[tool.hatch.build.targets.wheel.force-include]
"mcp_tools_mbpp.py" = "mcp_tools_mbpp.py"
"mcp_tools_swebench.py" = "mcp_tools_swebench.py"
[tool.mypy]
warn_return_any = true
explicit_package_bases = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    '.venv/',
]
